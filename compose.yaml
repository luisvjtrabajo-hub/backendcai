services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cai
      POSTGRES_USER: cai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cai -d cai"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Database: Host=db;Port=5432;Database=cai;Username=cai;Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:5173}
      Bootstrap__AdminEmail: ${Bootstrap__AdminEmail:?Configura el correo del administrador}
      Bootstrap__AdminPassword: ${Bootstrap__AdminPassword:?Configura la contraseña del administrador}
      Bootstrap__AdminName: ${Bootstrap__AdminName:-Administrador CAI}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
