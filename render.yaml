# Publicar el contenido de backendcai como raíz de su propio repositorio.
# Seleccionar render.yaml como ruta del Blueprint en Render.
services:
  - type: web
    name: backendcai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: cai-db
          property: connectionString
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Bootstrap__AdminEmail
        sync: false
      - key: Bootstrap__AdminPassword
        sync: false
      - key: Bootstrap__AdminName
        value: Administrador CAI
databases:
  - name: cai-db
    databaseName: cai
    user: cai
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
